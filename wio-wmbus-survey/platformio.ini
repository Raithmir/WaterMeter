; Wio Tracker L1 / L1 Pro - wM-Bus T1 survey firmware
; Board + variant files taken from meshtastic/firmware (GPL-3.0).

[env:wio_tracker_l1]
; same platform + framework fork Meshtastic uses for this board (has S140 v7.3 headers)
platform = platformio/nordicnrf52@11.0.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#0fd295f13203e93df19d578073646ec32f2bf45a
  platformio/toolchain-gccarmnoneeabi@1.90301.200702
framework = arduino
board = seeed_wio_tracker_L1
board_build.variants_dir = variants
board_build.ldscript = nrf52840_s140_v7.ld
build_flags =
  -Wl,-u,_printf_float
  -L${platformio.packages_dir}/framework-arduinoadafruitnrf52/cores/nRF5/linker
  -DLED_BUILTIN=-1
  -DLOOP_STACK_SZ=2048  ; loop task stack in words (8 KB, default 4 KB): packet handling + printf are close to 4 KB
  -DSS=4  ; variant has no default SPI CS; SdFat wants one (P1.14 = SX1262 CS, the only SPI device)
; exact versions this was built and tested with
lib_deps =
  jgromes/RadioLib@7.7.1
  olikraus/U8g2@2.36.18
  mikalhart/TinyGPSPlus@1.1.0
  adafruit/SdFat - Adafruit Fork@2.3.103
  adafruit/Adafruit SPIFlash@5.1.1
extra_scripts = post:scripts/uf2.py
monitor_speed = 115200
