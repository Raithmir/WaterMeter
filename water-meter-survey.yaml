esphome:
  name: water-meter-survey
  friendly_name: Water Meter Survey

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [ wmbus_common, wmbus_radio ]

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  # If the network above can't be joined (e.g. the placeholders are left in), the board
  # starts this hotspot; join it to enter Wi-Fi details on a setup page.
  ap:
    ssid: "Water Meter Survey Setup"

captive_portal:

# Lets web.esphome.io set the Wi-Fi details over USB straight after flashing
improv_serial:

api:
  # Don't restart when nothing connects: without Home Assistant nothing ever does,
  # and a restart would lose the found list
  reboot_timeout: 0s

# Survey page in a browser at http://<name>.local or the board's IP address:
# found meters and live logs, no Home Assistant needed
web_server:
  port: 80

ota:
  - platform: esphome

globals:
  - id: frame_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: found_ids
    type: std::vector<std::string>
    restore_value: false
  - id: found_rssis
    type: std::vector<int>
    restore_value: false
  - id: found_byte8s
    type: std::vector<int>
    restore_value: false
  - id: pending_ids
    type: std::vector<std::string>
    restore_value: false
  - id: pending_rssis
    type: std::vector<int>
    restore_value: false
  - id: view_index
    type: int
    restore_value: false
    initial_value: '-1'
  - id: best_id
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: best_rssi
    type: int
    restore_value: false
    initial_value: '-200'
  - id: best_is_sap
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: best_byte8
    type: int
    restore_value: false
    initial_value: '0'
  - id: best_set_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

script:
  # Publishes the found list (strongest first) for Home Assistant and the web page,
  # and optionally logs it in full so any log view catches up
  - id: report_found
    parameters:
      log_list: bool
    then:
      - lambda: |-
          auto &ids = id(found_ids);
          std::vector<size_t> order(ids.size());
          for (size_t i = 0; i < order.size(); i++) order[i] = i;
          std::sort(order.begin(), order.end(), [](size_t a, size_t b) {
            return id(found_rssis)[a] > id(found_rssis)[b];
          });
          // Home Assistant rejects states over 255 characters: keep the strongest that fit
          std::string out;
          for (size_t i : order) {
            char item[24];
            snprintf(item, sizeof(item), "0x%s %ddBm", ids[i].c_str(), id(found_rssis)[i]);
            size_t add = strlen(item) + (out.empty() ? 0 : 2);
            if (out.size() + add > 255) break;
            if (!out.empty()) out += ", ";
            out += item;
          }
          if (!id(found_list).has_state() || id(found_list).state != out)
            id(found_list).publish_state(out);
          if (log_list) {
            ESP_LOGI("survey", "Found %d meter(s), strongest first:", (int) ids.size());
            for (size_t i : order)
              ESP_LOGI("survey", "  0x%s  %ddBm  b8=%02X",
                       ids[i].c_str(), id(found_rssis)[i], id(found_byte8s)[i]);
          }

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  busy_pin: GPIO13
  irq_pin: GPIO14
  rx_gain: BOOSTED
  rf_switch: true
  has_tcxo: true
  on_frame:
    - then:
        - lambda: |-
            auto d = frame->data();
            if (d.size() < 10) return;
            id(frame_count) += 1;
            int rssi = frame->rssi();
            uint16_t m = d[2] | (d[3] << 8);
            bool diehl = (m == 0x4C30);
            uint32_t now = millis();

            // Only Diehl frames: other brands are no use here and bury the lines that matter
            if (diehl)
              ESP_LOGI("survey", "FRAME  RSSI: %ddBm  HEX: %s", rssi, frame->as_hex().c_str());

            char buf[9];
            snprintf(buf, sizeof(buf), "%02X%02X%02X%02X", d[7], d[6], d[5], d[4]);
            std::string sid(buf);

            // live strongest (expires after 5s so moving hands over)
            if (now - id(best_set_ms) > 5000) id(best_rssi) = -200;
            if (rssi >= id(best_rssi)) {
              id(best_id) = sid;
              id(best_rssi) = rssi;
              id(best_is_sap) = diehl;
              id(best_byte8) = d[8];
              id(best_set_ms) = now;
            }

            // log to list: strong Diehl frames, but require two hits before committing
            if (rssi >= -70 && diehl) {
              auto &ids = id(found_ids);
              bool committed = false;
              for (size_t i = 0; i < ids.size(); i++) {
                if (ids[i] == sid) {
                  committed = true;
                  if (rssi > id(found_rssis)[i]) {
                    id(found_rssis)[i] = rssi;
                    id(found_byte8s)[i] = d[8];
                  }
                  break;
                }
              }
              if (!committed) {
                // not yet in the found list — check the pending (seen-once) list
                auto &pids = id(pending_ids);
                bool was_pending = false;
                for (size_t i = 0; i < pids.size(); i++) {
                  if (pids[i] == sid) {
                    was_pending = true;
                    // second hit — promote to the found list
                    ids.push_back(sid);
                    id(found_rssis).push_back(rssi > id(pending_rssis)[i] ? rssi : id(pending_rssis)[i]);
                    id(found_byte8s).push_back(d[8]);
                    pids.erase(pids.begin() + i);
                    id(pending_rssis).erase(id(pending_rssis).begin() + i);
                    ESP_LOGI("survey", "NEW meter 0x%s  %ddBm  b8=%02X  (total %d)",
                             sid.c_str(), rssi, d[8], (int) ids.size());
                    id(report_found).execute(false);
                    break;
                  }
                }
                if (!was_pending) {
                  // first hit — hold it in pending
                  pids.push_back(sid);
                  id(pending_rssis).push_back(rssi);
                }
              }
            }

interval:
  - interval: 30s
    then:
      - script.execute:
          id: report_found
          log_list: true

text_sensor:
  - platform: template
    id: found_list
    name: "Survey Found Meters"

binary_sensor:
  - platform: gpio
    id: prg_button
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true  # the board's own PRG button
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              int n = id(found_ids).size();
              if (n == 0) { id(view_index) = -1; return; }
              id(view_index) += 1;
              if (id(view_index) >= n) id(view_index) = -1;
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(found_ids).clear();
              id(found_rssis).clear();
              id(found_byte8s).clear();
              id(pending_ids).clear();
              id(pending_rssis).clear();
              id(view_index) = -1;
              id(report_found).execute(false);

switch:
  - platform: gpio
    id: vext_power
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_med
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 500ms
    lambda: |-
      int n = id(found_ids).size();
      it.printf(0, 0, id(font_small), "Found: %d", n);
      it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "#%d", id(frame_count));

      if (id(view_index) < 0) {
        uint32_t age = (millis() - id(best_set_ms)) / 1000;
        if (id(best_rssi) > -200 && age < 8) {
          it.printf(0, 16, id(font_med), "%s", id(best_id).c_str());
          it.printf(0, 44, id(font_small), "%d dBm  %s  b8=%02X",
                    id(best_rssi), id(best_is_sap) ? "Diehl" : "other", id(best_byte8));
        } else {
          it.print(0, 24, id(font_small), "Move to a meter...");
        }
      } else {
        int i = id(view_index);
        if (i < n) {
          it.printf(0, 16, id(font_med), "%s", id(found_ids)[i].c_str());
          it.printf(0, 44, id(font_small), "%d/%d  %d dBm  b8=%02X",
                    i + 1, n, id(found_rssis)[i], id(found_byte8s)[i]);
        }
      }
