esphome:
  name: water-meter-gateway
  friendly_name: Water Meter Gateway

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [ wmbus_common, wmbus_radio, wmbus_meter ]

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

api:

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: last_telegram_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: display_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: display_on
    type: bool
    restore_value: false
    initial_value: 'true'

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  busy_pin: GPIO13
  irq_pin: GPIO14
  rx_gain: BOOSTED
  rf_switch: true
  has_tcxo: true

wmbus_meter:
  - id: water_meter
    meter_id: YOUR_METER_ID
    type: izar
    mode:
      - T1
    on_telegram:
      then:
        - lambda: 'id(last_telegram_ms) = millis();'

sensor:
  - platform: wmbus_meter
    parent_id: water_meter
    field: total_m3
    id: water_total
    name: "Water Total"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: water_meter
    field: last_month_total_m3
    id: water_last_month
    name: "Water Last Month Total"
    unit_of_measurement: "m³"
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: water_meter
    field: remaining_battery_life_y
    id: water_battery
    name: "Water Meter Battery Life"
    unit_of_measurement: "y"
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: water_meter
    field: rssi_dbm
    id: water_rssi
    name: "Water Meter RSSI"
    device_class: signal_strength
    unit_of_measurement: "dBm"

  - platform: wmbus_meter
    parent_id: water_meter
    field: transmit_period_s
    id: water_tx_period
    name: "Water Meter Transmit Period"
    unit_of_measurement: "s"
    accuracy_decimals: 0

  - platform: uptime
    id: sys_uptime
    name: "Water Gateway Uptime"

  - platform: wifi_signal
    id: wifi_rssi
    name: "Water Gateway WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wmbus_meter
    parent_id: water_meter
    field: current_alarms
    id: water_alarms
    name: "Water Meter Alarms"

  - platform: wmbus_meter
    parent_id: water_meter
    field: previous_alarms
    id: water_alarms_prev
    name: "Water Meter Previous Alarms"

  - platform: wmbus_meter
    parent_id: water_meter
    field: last_month_measure_date
    name: "Last Month Reading Date"

  - platform: version
    name: "Water Gateway ESPHome Version"

binary_sensor:
  - platform: template
    id: water_leak
    name: "Water Leak"
    device_class: problem
    lambda: |-
      if (!id(water_alarms).has_state()) return false;
      return id(water_alarms).state.find("leakage") != std::string::npos;

  - platform: template
    id: water_any_alarm
    name: "Water Meter Fault"
    device_class: problem
    lambda: |-
      if (!id(water_alarms).has_state()) return false;
      std::string s = id(water_alarms).state;
      return !s.empty() && s != "no_alarm";

  - platform: template
    id: water_stale
    name: "Water Meter Stale"
    device_class: problem

  - platform: gpio
    id: prg_button
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              if (!id(display_on)) {
                id(display_on) = true;
                id(oled).turn_on();
                return;
              }
              id(display_page) += 1;
              if (id(display_page) > 2) id(display_page) = 0;
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: |-
              id(display_on) = !id(display_on);
              if (id(display_on)) id(oled).turn_on();
              else id(oled).turn_off();

interval:
  - interval: 60s
    then:
      - lambda: |-
          // Never heard since boot counts from boot (last_telegram_ms starts at 0), so a
          // gateway that can't hear the meter after a restart still goes stale.
          id(water_stale).publish_state((millis() - id(last_telegram_ms)) > 21600000);  // 6 hours

switch:
  - platform: gpio
    id: vext_power
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 24

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 1s
    lambda: |-
      if (!id(display_on)) return;

      // ================= PAGE 0: main reading =================
      if (id(display_page) == 0) {
        if (id(water_rssi).has_state()) {
          it.printf(0, 0, id(font_small), "%.0f dBm", id(water_rssi).state);
        } else {
          it.print(0, 0, id(font_small), "no signal");
        }
        if (id(water_battery).has_state()) {
          it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT,
                    "%.1fy", id(water_battery).state);
        }

        if (id(water_total).has_state()) {
          it.printf(0, 17, id(font_big), "%.3f", id(water_total).state);
          it.print(104, 27, id(font_small), "m3");
        } else {
          it.print(0, 23, id(font_small), "Waiting for frame...");
        }

        if (id(water_any_alarm).state) {
          if ((millis() / 1000) % 2 == 0) {
            it.filled_rectangle(0, 50, 128, 14);
            it.print(64, 51, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER,
                     id(water_leak).state ? "LEAK ALARM" : "METER FAULT");
          } else {
            it.print(64, 51, id(font_small), TextAlign::TOP_CENTER,
                     id(water_alarms).state.c_str());
          }
        } else if (id(last_telegram_ms) == 0) {
          it.print(0, 51, id(font_small), "never seen");
        } else {
          uint32_t age = (millis() - id(last_telegram_ms)) / 1000;
          if (age < 90) {
            it.printf(0, 51, id(font_small), "seen %lus ago", age);
          } else if (age < 5400) {
            it.printf(0, 51, id(font_small), "seen %lum ago", age / 60);
          } else {
            it.printf(0, 51, id(font_small), "seen %luh ago", age / 3600);
          }
        }

      // ================= PAGE 1: diagnostics =================
      } else if (id(display_page) == 1) {
        it.print(0, 0, id(font_small), "Diagnostics");

        if (id(water_battery).has_state())
          it.printf(0, 15, id(font_small), "Battery: %.1f y", id(water_battery).state);
        if (id(water_rssi).has_state())
          it.printf(0, 28, id(font_small), "Meter: %.0f dBm", id(water_rssi).state);
        if (id(wifi_rssi).has_state())
          it.printf(0, 41, id(font_small), "WiFi: %.0f dBm", id(wifi_rssi).state);
        if (id(sys_uptime).has_state()) {
          uint32_t up = (uint32_t) id(sys_uptime).state;
          it.printf(0, 54, id(font_small), "Up: %luh %lum",
                    up / 3600, (up % 3600) / 60);
        }

      // ================= PAGE 2: alarm history =================
      } else {
        it.print(0, 0, id(font_small), "Alarm status");
        it.printf(0, 16, id(font_small), "Now:  %s",
                  id(water_alarms).has_state() ? id(water_alarms).state.c_str() : "-");
        it.printf(0, 32, id(font_small), "Prev: %s",
                  id(water_alarms_prev).has_state() ? id(water_alarms_prev).state.c_str() : "-");
        it.printf(0, 50, id(font_small), "TX every: %s",
                  id(water_tx_period).has_state() ? to_string((int) id(water_tx_period).state).c_str() : "-");
      }
