# Host tests, survey firmware build and ESPHome compiles on every push.
# A tag v* also publishes the survey firmware (Wio .uf2, Heltec and XIAO .bin) as a GitHub release.
name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wio-wmbus-survey
    steps:
      - uses: actions/checkout@v4
      - name: Decoder test
        run: g++ -std=c++17 -Wall -Isrc test/test_host.cpp -o t && ./t
      - name: Storage and CSV test
        run: g++ -std=c++17 -Wall -Isrc test/test_survey.cpp -o ts && ./ts

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wio-wmbus-survey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('wio-wmbus-survey/platformio.ini') }}
      - run: pip install platformio
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: wio-wmbus-survey-firmware
          path: wio-wmbus-survey/.pio/build/wio_tracker_l1/firmware.uf2

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - water-meter-survey
          - water-meter-survey-xiao
          - water-meter-gateway
          - water-meter-gateway-xiao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-2026.9.0-esp32s3
      - run: pip install esphome==2026.9.0
      - name: Compile
        # The committed configs hold placeholders; give them values that pass validation.
        # Wi-Fi is set after flashing (improv_serial / fallback hotspot), so the survey
        # builds are usable as released.
        run: |
          mkdir ci dist
          f=${{ matrix.config }}.yaml
          sed -e 's/YOUR_METER_ID/0x12345678/' -e 's/YOUR_WIFI_PASSWORD/ci-password/' "$f" > "ci/$f"
          esphome compile "ci/$f"
          cp "$(find ci/.esphome/build/${{ matrix.config }} -name firmware.factory.bin | head -1)" \
             "dist/${{ matrix.config }}.factory.bin"
      # Only the surveys are released: the gateways have the meter ID compiled in
      - if: startsWith(matrix.config, 'water-meter-survey')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config }}-firmware
          path: dist/${{ matrix.config }}.factory.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware, esphome]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-firmware"
          merge-multiple: true
      - run: mv firmware.uf2 wio-tracker-survey.uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wio-tracker-survey.uf2
            water-meter-survey.factory.bin
            water-meter-survey-xiao.factory.bin
          generate_release_notes: true
